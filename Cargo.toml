[package]
name = "envsync"
version = "0.1.0"
edition = "2021"
description = "Sync .env files across git worktrees"
license = "MIT"
repository = "https://github.com/dukeetheprogrammer/envsync"
keywords = ["env", "dotenv", "worktree", "git", "sync"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "envsync"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
colored = "2"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
similar = "2"
glob = "0.3"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
